name: Package

# Installers are built for the current OS only, so each runner builds its own formats.
# Runs on every pull request (artifacts appear on the run / PR checks) and attaches the
# installers to the release when one is published.
on:
  release:
    types: [published]
  pull_request:
    # Installers are expensive to build and never affected by prose changes
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only for every run, pull requests included; only the release job below can write.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (DMG)
            os: macos-latest
            task: packageDmg
          - name: Linux (DEB/RPM)
            os: ubuntu-latest
            task: packageDeb packageRpm
          - name: Windows (MSI/EXE)
            os: windows-latest
            task: packageMsi packageExe
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build installers
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.task }}

      # A wrong icon file does not fail the build: jpackage warns and quietly substitutes the JDK's
      # JavaApp icon (Duke), which is how the 2026-10-17 audit found the DMG shipping Duke. The app
      # image every installer embeds is checked against the icons in the repository before upload.
      - name: Verify the packaged icon
        shell: bash
        run: ./gradlew --no-daemon verifyInstallerIcon

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: findesk-${{ runner.os }}
          # Only the installers: `main/**` would also pick up the unpacked runtime image
          # and every dependency jar.
          path: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    # Also after a failed platform, so the installers that did build still reach the release
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: findesk-*
          path: installers
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          # Each artifact keeps the per-format folders (dmg/, msi/, ...) below binaries/main
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.deb
            installers/**/*.rpm
