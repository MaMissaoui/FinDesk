name: Package

# Installers are built for the current OS only, so each runner builds its own formats.
# Runs on every pull request that can affect packaging (artifacts appear on the run / PR checks),
# on every push to main, and attaches the installers to the release when one is published.
# The main push also builds the installers and verifies them; it additionally writes the Gradle
# caches for the three OS runners (gradle/actions/setup-gradle only saves a cache from the
# default branch), so PR packaging runs start warm instead of cold.
on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    # Installers are expensive to build, so a PR only builds them when a change can alter
    # the packaged result. Kotlin source changes are deliberately not listed: ci.yml compiles
    # and tests them on the same commit, and the main push run above still packages them, so
    # a PR does not need an installer to know whether the code is good.
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "src/main/resources/**"
      - ".github/workflows/package.yml"
      - "install-mac.command"
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only for every run, pull requests included; only the release job below can write.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (DMG)
            os: macos-latest
            task: packageDmg
          - name: Linux (DEB/RPM)
            os: ubuntu-latest
            task: packageDeb packageRpm
          - name: Windows (MSI/EXE)
            os: windows-latest
            task: packageMsi packageExe
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm xvfb

      - name: Build installers
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.task }}

      # A wrong icon file does not fail the build: jpackage warns and quietly substitutes the JDK's
      # JavaApp icon (Duke), which is how the 2026-10-17 audit found the DMG shipping Duke. The app
      # image every installer embeds is checked against the icons in the repository before upload.
      - name: Verify the packaged icon
        shell: bash
        run: ./gradlew --no-daemon verifyInstallerIcon

      # Issue #38: the installed app runs on the trimmed runtime jpackage builds, which has no
      # java.exe and may lack something JNA needs. CredentialStores.create() catches every load
      # failure and returns NoCredentialStore, so a broken store would silently hide "Remember PIN".
      # This runs the self-check from the installed MSI, not from the Gradle test runtime.
      # windows-latest is Windows Server, so Windows 11 itself is still checked by hand with the same flag.
      - name: Verify the Windows credential store in the packaged app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$message) {
            Write-Host "::error::$message"
            exit 1
          }

          $msis = @(Get-ChildItem -Path 'build/compose/binaries/main/msi' -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            Fail "expected one MSI in build/compose/binaries/main/msi, found $($msis.Count)"
          }
          $msi = $msis[0]
          Write-Host "Installing $($msi.FullName)"

          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content $log -Tail 50
            }
            Fail "MSI install failed with exit code $($install.ExitCode)"
          }

          # perUserInstall = true: the MSI installs into the FinDesk folder under LOCALAPPDATA.
          $installs = @(Get-ChildItem -Path $env:LOCALAPPDATA -Directory -Filter 'FinDesk' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike '*\build\*' })
          $exe = $installs |
            ForEach-Object { Get-ChildItem -Path $_.FullName -Filter 'FinDesk.exe' -File -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $exe) {
            $installs = @(Get-ChildItem -Path $env:ProgramFiles -Directory -Filter 'FinDesk' -Recurse -ErrorAction SilentlyContinue)
            $exe = $installs |
              ForEach-Object { Get-ChildItem -Path $_.FullName -Filter 'FinDesk.exe' -File -ErrorAction SilentlyContinue } |
              Select-Object -First 1
          }
          if (-not $exe) {
            Fail 'FinDesk.exe was not found after installing the MSI'
          }
          Write-Host "Found $($exe.FullName)"

          # The launcher is a GUI program, so stdout is not captured: the result file is the evidence.
          $result = Join-Path $env:RUNNER_TEMP 'credential-self-check.txt'
          Remove-Item -Path $result -ErrorAction SilentlyContinue
          # On failure the step prints the launcher's stdout/stderr, the install folder and its .cfg. A launcher
          # that fails before the JVM runs prints nothing itself: the .cfg is what showed the -Xdock option (#72).
          $stdout = Join-Path $env:RUNNER_TEMP 'self-check-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'self-check-stderr.txt'
          $run = Start-Process $exe.FullName -ArgumentList '--credential-self-check', "`"$result`"" -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $line = $null
          if (Test-Path $result) {
            $line = [string](Get-Content -Path $result -TotalCount 1)
            Write-Host "Self-check: $line"
          } else {
            Write-Host 'Self-check: no result file'
          }
          if ($run.ExitCode -ne 0 -or -not $line -or -not $line.StartsWith('OK:')) {
            Write-Host '--- launcher stdout'; Get-Content $stdout -ErrorAction SilentlyContinue
            Write-Host '--- launcher stderr'; Get-Content $stderr -ErrorAction SilentlyContinue
            Write-Host '--- install folder'
            Get-ChildItem -Path $exe.DirectoryName -Depth 1 | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem -Path $exe.DirectoryName -Filter '*.cfg' -Recurse | ForEach-Object {
              Write-Host "--- $($_.FullName)"; Get-Content $_.FullName
            }
          }
          if ($run.ExitCode -ne 0) {
            Fail "credential self-check exited with $($run.ExitCode)"
          }
          if (-not (Test-Path $result)) {
            Fail "credential self-check wrote no result file ($result)"
          }
          if (-not $line -or -not $line.StartsWith('OK:')) {
            Fail "credential self-check did not report OK: '$line'"
          }

      # Launch checks: every installed Windows and Linux build since v1.2.0 failed to start because the
      # macOS-only -Xdock JVM option (added 2026-10-04) reached their launcher configs, and CI only built
      # installers, so it never saw the failure. macOS was not affected, but is checked the same way. Off Windows --credential-self-check is handled before any
      # window or data directory, writes "SKIP: not Windows" and exits with 2; reaching that line proves the
      # installed launcher started the JVM and ran main().
      - name: Verify the installed Linux app starts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          debs=("build/compose/binaries/main/deb/"*.deb)
          if [ "${#debs[@]}" -ne 1 ] || [ ! -f "${debs[0]}" ]; then
            echo "::error::expected exactly one .deb in build/compose/binaries/main/deb, found ${#debs[@]}"
            ls -l build/compose/binaries/main/deb || true
            exit 1
          fi
          deb="${debs[0]}"
          echo "Installing $deb"
          # The package's post-install script registers the menu entry with xdg-desktop-menu, which fails
          # ("No writable system menu directory found") on a runner without the menu directories a desktop has
          sudo mkdir -p /usr/share/desktop-directories /usr/share/applications
          sudo apt-get install -y "./$deb"

          # The Debian package is named findesk (build.gradle.kts linux { packageName }); its launcher
          # is the one executable regular file under a bin/ directory in the package's file list.
          launcher=""
          while IFS= read -r candidate; do
            # Skip the trimmed runtime's own bin entries; the launcher is the app image's bin/<name>
            case "$candidate" in
              */lib/runtime/bin/*) continue ;;
            esac
            resolved=$(readlink -f "$candidate" 2>/dev/null || true)
            if [ -n "$resolved" ] && [ -f "$resolved" ] && [ -x "$resolved" ]; then
              launcher="$resolved"
              break
            fi
          done < <(dpkg -L findesk | grep -E '/bin/[^/]+$' || true)
          if [ -z "$launcher" ]; then
            echo "::error::no executable launcher found in the findesk package"
            dpkg -L findesk || true
            exit 1
          fi
          echo "Launcher: $launcher"

          result="$RUNNER_TEMP/launch-check.txt"
          stdout="$RUNNER_TEMP/launch-check-stdout.txt"
          stderr="$RUNNER_TEMP/launch-check-stderr.txt"
          rm -f "$result"

          set +e
          "$launcher" --credential-self-check "$result" >"$stdout" 2>"$stderr"
          status=$?
          set -e

          # The flag returns before Compose opens a window, so a plain run should work on a headless
          # runner. If it still fails without a DISPLAY, retry once under Xvfb before judging the launch.
          if [ "$status" -ne 2 ] && [ -z "${DISPLAY:-}" ]; then
            echo "Plain run exited $status; retrying under xvfb-run"
            rm -f "$result"
            set +e
            xvfb-run -a "$launcher" --credential-self-check "$result" >"$stdout" 2>"$stderr"
            status=$?
            set -e
          fi

          first_line=""
          if [ -f "$result" ]; then
            first_line=$(head -n 1 "$result" || true)
          fi
          if [ "$status" -eq 2 ] && [ "$first_line" = "SKIP: not Windows" ]; then
            echo "Launch check passed: exit 2, '$first_line'"
            exit 0
          fi

          echo "::error::the installed launcher did not start main(): exit $status"
          echo "--- exit code: $status"
          if [ -f "$result" ]; then
            echo "--- result file $result"
            cat "$result"
          else
            echo "no result file"
          fi
          echo "--- launcher stdout"
          cat "$stdout" 2>/dev/null || true
          echo "--- launcher stderr"
          cat "$stderr" 2>/dev/null || true
          echo "--- launcher config"
          app_dir=$(dirname "$(dirname "$launcher")")
          shopt -s nullglob
          cfgs=("$app_dir"/lib/app/*.cfg)
          if [ "${#cfgs[@]}" -eq 0 ]; then
            echo "no .cfg under $app_dir/lib/app"
          else
            cat "${cfgs[@]}"
          fi
          exit 1

      - name: Verify the installed macOS app starts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          # The DMG's payload is the app image jpackage built, so mounting the DMG is not needed
          launcher="build/compose/binaries/main/app/FinDesk.app/Contents/MacOS/FinDesk"
          if [ ! -x "$launcher" ]; then
            echo "::error::packaged app image not found: $launcher"
            ls -l build/compose/binaries/main/app || true
            exit 1
          fi
          echo "Launcher: $launcher"

          result="$RUNNER_TEMP/launch-check.txt"
          stdout="$RUNNER_TEMP/launch-check-stdout.txt"
          stderr="$RUNNER_TEMP/launch-check-stderr.txt"
          rm -f "$result"

          set +e
          "$launcher" --credential-self-check "$result" >"$stdout" 2>"$stderr"
          status=$?
          set -e

          first_line=""
          if [ -f "$result" ]; then
            first_line=$(head -n 1 "$result" || true)
          fi
          if [ "$status" -eq 2 ] && [ "$first_line" = "SKIP: not Windows" ]; then
            echo "Launch check passed: exit 2, '$first_line'"
            exit 0
          fi

          echo "::error::the packaged app image did not start main(): exit $status"
          echo "--- exit code: $status"
          if [ -f "$result" ]; then
            echo "--- result file $result"
            cat "$result"
          else
            echo "no result file"
          fi
          echo "--- launcher stdout"
          cat "$stdout" 2>/dev/null || true
          echo "--- launcher stderr"
          cat "$stderr" 2>/dev/null || true
          echo "--- launcher config"
          shopt -s nullglob
          cfgs=(build/compose/binaries/main/app/FinDesk.app/Contents/app/*.cfg)
          if [ "${#cfgs[@]}" -eq 0 ]; then
            echo "no .cfg under FinDesk.app/Contents/app"
          else
            cat "${cfgs[@]}"
          fi
          exit 1

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: findesk-${{ runner.os }}
          # Only the installers: `main/**` would also pick up the unpacked runtime image
          # and every dependency jar.
          path: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    # Also after a failed platform, so the installers that did build still reach the release
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: findesk-*
          path: installers
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          # Each artifact keeps the per-format folders (dmg/, msi/, ...) below binaries/main
          files: |
            installers/**/*.dmg
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.deb
            installers/**/*.rpm
