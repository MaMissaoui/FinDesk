name: CI

# Prose-only changes cannot break the build or the tests, so they skip CI. paths-ignore (not
# paths) is used so a new non-Markdown file is tested without touching this workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    # The step took 116 s on PR #33; a hung Gradle daemon or a stuck download should
    # fail fast instead of holding a runner for the default six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Tesseract (OCR tests run when it is present)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu

      - name: Lint and test
        run: ./gradlew --no-daemon ktlintCheck test

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/ktlint
          if-no-files-found: ignore
          retention-days: 7
