name: Windows credentials

# The Credential Manager store can only be exercised on Windows, so this workflow runs the two
# credential tests on a Windows runner. The plain CI workflow compiles and tests everything but
# does not need a Windows machine; this one fails if either test is skipped, since a skipped test on
# Windows must never look like a pass.
on:
  push:
    branches: [main]
    paths:
      - "src/main/kotlin/de/findesk/banking/CredentialStore.kt"
      - "src/test/kotlin/de/findesk/banking/WindowsCredentialStoreTest.kt"
      - "src/test/kotlin/de/findesk/banking/CredentialLayoutTest.kt"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/windows-credentials.yml"
  pull_request:
    paths:
      - "src/main/kotlin/de/findesk/banking/CredentialStore.kt"
      - "src/test/kotlin/de/findesk/banking/WindowsCredentialStoreTest.kt"
      - "src/test/kotlin/de/findesk/banking/CredentialLayoutTest.kt"
      - "build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/windows-credentials.yml"
  workflow_dispatch:

concurrency:
  group: windows-credentials-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credentials:
    name: Windows Credential Manager round trip
    runs-on: windows-latest
    # A hung Gradle daemon or a stuck download should fail fast instead of holding a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run the Windows credential tests
        shell: bash
        run: ./gradlew --no-daemon test --tests 'de.findesk.banking.WindowsCredentialStoreTest' --tests 'de.findesk.banking.CredentialLayoutTest'

      # The Windows store is skipped off Windows. On this runner a skip would mean the test never
      # ran, which must fail the build rather than look green.
      - name: Fail if a credential test was skipped
        shell: bash
        run: |
          set -euo pipefail
          for name in WindowsCredentialStoreTest CredentialLayoutTest; do
            file="build/test-results/test/TEST-de.findesk.banking.$name.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$name produced no test results ($file is missing)"
              exit 1
            fi
            suite=$(grep -m1 '<testsuite ' "$file")
            tests=$(printf '%s' "$suite" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
            skipped=$(printf '%s' "$suite" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p')
            echo "$name: tests=$tests skipped=$skipped"
            if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then
              echo "::error::$name ran no tests on Windows"
              exit 1
            fi
            if [ "$skipped" != "0" ]; then
              echo "::error::$name was skipped on Windows"
              exit 1
            fi
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-credentials-test-results
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 7
