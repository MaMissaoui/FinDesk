version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
    # Major versions (Exposed 1.x, JUnit 6, ...) are migrations, done on purpose rather than as update PRs
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
