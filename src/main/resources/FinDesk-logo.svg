<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(8, 8)">
    <!-- Background -->
    <rect x="0" y="0" width="84" height="84" rx="18" fill="url(#bgGrad)"/>

    <!-- Letter F -->
    <rect x="26" y="18" width="9" height="48" rx="2" fill="#FFFFFF"/>
    <rect x="26" y="18" width="35" height="9" rx="2" fill="#FFFFFF"/>
    <rect x="26" y="38" width="28" height="7" rx="2" fill="#FFFFFF" opacity="0.85"/>

    <!-- Chart line -->
    <polyline points="52,44 58,34 64,38 72,22"
              fill="none"
              stroke="url(#chartGrad)"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <!-- Chart dot -->
    <circle cx="72" cy="22" r="3" fill="#6EE7B7"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="60"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="-1">
    <tspan fill="#FFFFFF">Fin</tspan><tspan fill="#93C5FD">Desk</tspan>
  </text>
</svg>